name: frontline
description: "OneMaanicare IFM - P0 Mobile Field App (Technician/Supervisor field application)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^18.1.4

  # Offline-first relational database
  drift: ^2.22.1
  # Pinned below the 0.6.0+eol stub release, which deliberately ships no
  # code (it tells users to migrate to sqlite3 v3.x's built-in bundling,
  # which drift does not yet support) - using it silently drops
  # libsqlite3.so from the APK, crashing on first DB access.
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^7.3.2

  # Local secure storage for tokens
  flutter_secure_storage: ^11.2.0

  # Unique ids
  uuid: ^4.5.1

  # Diagnostics export
  share_plus: ^13.3.1

  # QR / barcode scanning
  mobile_scanner: ^7.5.0

  # Camera capture for evidence photos (checklist items, before/after shots)
  image_picker: ^1.1.2

  # On-screen signature capture (technician/supervisor closure sign-off)
  signature: ^5.5.0

  # Permission handling (camera/location for scan & check-in)
  permission_handler: ^13.0.2

  # GPS check-in (Section 11: "Checks in via GPS where appropriate")
  geolocator: ^14.0.1

  # Voice-to-Workflow (Section 16.12): on-device speech recognition
  speech_to_text: ^7.0.0

  # Biometric login (Screen 01: "Biometric login after first authentication")
  local_auth: ^2.3.0

  # Logging utility (collected into AppLogger NDJSON sink)
  logger: ^2.5.0

  # Date/time formatting
  intl: ^0.20.3

  # Opens asset documents (manual/warranty/drawing/SOP/certificates) in
  # an external viewer - the mobile app links to them, it doesn't render
  # PDFs itself.
  url_launcher: ^6.3.1

  # Voice note recording (Screen 06: "Optional: ... Voice note")
  record: ^6.0.0
  nfc_manager: ^4.4.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0+1
  drift_dev: ^2.22.1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
